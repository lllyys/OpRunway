# Codex CLI configuration for this project.
# See: https://developers.openai.com/codex/config-reference

# Uncomment to also read CLAUDE.md as a fallback instruction source:
# project_doc_fallback_filenames = ["CLAUDE.md"]
service_tier = "fast"

# Claude delegation is disabled for this project.

[mcp_servers.claude-code]
# Disabled entries still require a valid transport definition.
command = "npx"
args = ["-y", "claude-octopus@1.2.0"]
enabled = false

# Codex-only project: disable Grok delegation without changing global plugins.
[plugins."codex-suite@codex-suite"]
enabled = false
