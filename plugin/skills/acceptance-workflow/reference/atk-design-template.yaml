# ATK design 模版 —— 精度判据锁定《生态算子开源精度标准》
#
# 尖括号处按算子填；其余是标准与工具事实，不要改，改了要在 spec 里写明理由。
# 阈值逐字抄自 reference/experimental_standard.md §2.2，**不要依赖 ATK 内建默认值**——
# 实测 hf32 / fp8e4m3 / fp8e5m2 三种的内建默认与该标准不符（见 atk-internals.md）。
#
# 依据版本：ATK 26.5.14（commit 7220f27）。换版本要重新核对字段名与内建默认值。

# ── 算子身份：每个算子都不同 ─────────────────────────────────────────
api: pytorch                      # CPU 真值来源
api_type: function
name: <torch 参考实现，如 torch.roll>
aclnn_name: <算子名，如 Roll>
aclnn_api_type: <aclnn_function；用了 execution plugin 就填插件里注册的名字>
version: <ATK 语义版本>
generate: <generator plugin 名；不用就删掉这一行>
backward: false
outputs: null

# ── 规模：dtype_numbers 与 extra_numbers 决定用例总量 ────────────────
# 标准 §1.1 要求「全组合覆盖」，但未设固定下限；这两个值是与预算的折中，
# 调小要在 spec 的 unvalidated_requirements 里说明覆盖被削到什么程度。
dtype_numbers: <每个 dtype 生成几个常规 case>
extra_numbers: all                # 边界 case 不设上限

# ── 精度判据：写成字典形式，值原样展开成比较器的 kwargs ──────────────
# 通路已核实：atk/tasks/executors/compare_excutor.py:176
#   AccuracyFactory.get_accuracy(name)(config, **standard.acc[name])
# 键名前缀限 fp16_ bf16_ fp32_ hf32_ fp8e4m3_ fp8e5m2_，写错会 raise ValueError（不是静默失效）。
# complex64 由 ATK 内部映射到 fp32 那一列，且实部虚部分别判定，无需单独配置。

# ── dtype 分流：单份 design 即可，不必按 dtype 拆 ────────────────────
# mixed_tolerance_bm 遇到不支持的 dtype 会回落到 single_bm
# （mixed_tolerance_benchmark_compare.py:149-151），而 single_bm 对整型本就转交
# equal_compare（single_benchmark_compare.py:150-168）。实际分流：
#
#   fp16 bf16 fp32 hf32 fp8e4m3 fp8e5m2  → 混合容差，用下面写死的标准阈值
#   complex64                            → 混合容差，FLOAT32 列，实部虚部各自判
#   uint8 int16 int32 int64              → 逐位相等（显式转 equal_compare）
#   bool、uint32 等取不到阈值的           → 逐位相等（torch.equal）
#   int8                                 → ⚠ 量化标准，绝对误差 ≤ 1
#
# ⚠ int8 是唯一的例外，也是一个静默放松点：搬运类算子的输出本该逐字节相等，±1 会
# 放过真实的搬运错误。正确做法是在 generator plugin 的 after_case_config() 里，把 int8
# 那批 case 的 standard.acc 改成 "equal"——该钩子是每个 case 生成的最后一步
# （base_generator.py:157），在 atk case 主流程内。这样一次 casegen 一次执行，caseset
# 仍由 ATK 自己写出，ID 连续、分母完整。不要跑两遍，也不要事后改 JSON。
# 已排除的其它路径见 atk-internals.md。
# ⚠ 阈值一律写成带小数点的形式（0.1 而不是 1e-1）。YAML 1.1 的 float resolver 要求
# 尾数里有小数点，`1e-1` `1e0` `1e-2` 会被解析成字符串，比较器崩在 abs_error <= threshold。
standard:
  acc:
    mixed_tolerance_bm:
      fp16_rtol: 1.95e-3
      fp16_atol: 1.95e-3
      fp16_required_matched_ratio: 0.99
      fp16_max_abs_error_limit: 0.1
      bf16_rtol: 1.56e-2
      bf16_atol: 1.56e-2
      bf16_required_matched_ratio: 0.99
      bf16_max_abs_error_limit: 1.0
      fp32_rtol: 9.77e-4
      fp32_atol: 1.53e-5
      fp32_required_matched_ratio: 0.99
      fp32_max_abs_error_limit: 0.01
      # 下面三种 ATK 内建默认与标准不符，算子若支持必须显式写：
      hf32_rtol: 1.95e-3          # 标准 2^-9；ATK 内建误作 9.77e-4
      hf32_atol: 9.77e-4          # 标准 2^-10；ATK 内建误作 1.53e-5
      hf32_required_matched_ratio: 0.99
      hf32_max_abs_error_limit: 0.1
      fp8e4m3_rtol: 0.25          # 标准 2^-2；ATK 内建误作 0.125
      fp8e4m3_atol: 0.0625        # 标准 2^-4；ATK 内建误作 0.125
      fp8e4m3_required_matched_ratio: 0.99
      fp8e4m3_max_abs_error_limit: 1.0
      fp8e5m2_rtol: 0.5           # 标准 2^-1；ATK 内建误作 0.25
      fp8e5m2_atol: 0.125         # 标准 2^-3；ATK 内建误作 0.25
      fp8e5m2_required_matched_ratio: 0.99
      fp8e5m2_max_abs_error_limit: 0.1
  perf: not_key                   # 性能测量恒做，但是否构成判据由任务书决定

shape_distributions: [[0, 1.0]]   # 别改：其它取值极易让生成器死循环

inputs:
  - name: null
    type: tensor
    required: true
    backward: false
    dtypes:
      values: [<按任务书列全，含必须保持不变的原有 dtype>]
    ranges:
      valid:
        values: [[-5, 5]]         # 标准 §1.2 值域
    shapes:
      dim_numbers:
        values: [1, 2, 3, 4, 5, 6, 7, 8]        # 标准 §1.2：1~8 维
      dim_values:
        values: [1, 3, 7, 8, 15, 16, 31, 32, 63, 64, 127, 128, 255, 256, [1, 1024]]
        # 标准 §1.2 要求 2^n 与 2^n-1 成对；上界按算子实际能力收，别一路铺到 2^20
      max_length: <总元素数上限，标准 §1.2 封顶 2^31 = 2147483648>
    boundary:
      has_empty: true             # §1.4 每种 dtype 至少一次
      has_scalar: true            # §1.4
      has_lower_border: true      # §1.4 下边界：各维均为 1
      has_infnan: true            # §1.4 必测。mixed_tolerance_bm 下 NPU 侧含 nan/inf 判不过，
                                  # 有判别力；single_bm 下 CPU 侧含 nan/inf 会无条件判过，那条
                                  # 通路上这些用例不具判别力（见 atk-source-facts.md）
      has_upper_border: false     # 关掉并在 spec 记 UNVALIDATED：ATK 硬编码 shape[i] = 2^31 + 1
                                  # （parameter_extra_tensor.py:177），不看 max_length，无设备可容。
                                  # 标准 §1.2 的上边界覆盖因此在本工具上落不了地
