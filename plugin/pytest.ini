[pytest]
# 只收 skill/ 下自己写的测试。third_party/ATK 是只读 submodule，自带一整套
# ut，依赖 prettytable 等本仓不装的包——不排掉的话仓根裸跑 pytest 会以
# 25 个收集错误中断，全都与本仓无关，新人第一条命令就撞上。
# .claude/hooks 收的是门禁量具自己的测试。门禁要拦别人，先得自己可信——
# doc_style_lint 的判据误报一次就会被忽略，被忽略的门禁等于没有。
testpaths = skill .claude/hooks
norecursedirs = third_party .git __pycache__ .pytest_cache

# 按路径而不是按裸文件名解析模块身份。各 skill 的 scripts/ 下有同名模块
# （`probe_env`、`verdict`），pytest 默认的 prepend 模式按文件名当模块名放进
# sys.modules，同名文件在同一次收集里会撞：要么 "import file mismatch" 收集
# 失败，要么撞进缓存拿到另一个文件的模块对象。
#
# 跨侧的 sys.path 与 sys.modules 隔离另有其事，在仓根 conftest.py 里。
addopts = --import-mode=importlib
